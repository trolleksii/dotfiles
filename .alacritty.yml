window:
  dimensions:
    columns: 0
    lines: 0
  position:
    x: 0
    y: 0
  padding:
    x: 0
    y: 0
  dynamic_padding: true
  decorations: buttonless
  startup_mode: fullscreen
  opacity: 0.9
  class:
    instance: Alacritty
    general: Alacritty
scrolling:
  history: 10000
  multiplier: 3
font:
  normal:
    family: Fira Code
    style: Retina
  bold:
    family: Fira Code
    style: Bold
  italic:
    family: Fira Code
    style: Italic
  bold_italic:
    family: Fira Code
    style: Bold Italic
  size: 17
  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0
  use_thin_strokes: true
draw_bold_text_with_bright_colors: false
colors:
  primary:
    background: '#232136'
    foreground: '#e0def4'
  cursor:
    text: CellBackground
    cursor: CellForeground
  vi_mode_cursor:
    text: CellBackground
    cursor: CellForeground
  selection:
    text: CellBackground
    selection: CellForeground
  search:
    matches:
      foreground: '#000000'
      background: '#ffffff'
    bar:
      background: '#c5c8c6'
      foreground: '#1d1f21'
  normal:
    black: '#393552'
    red: '#eb6f92'
    green: '#3e8fb0'
    yellow: '#f6c177'
    blue: '#9ccfd8'
    magenta: '#c4a7e7'
    cyan: '#ea9a97'
    white: '#e0def4'
  bright:
    black: '#6e6a86'
    red: '#eb6f92'
    green: '#3e8fb0'
    yellow: '#f6c177'
    blue: '#9ccfd8'
    magenta: '#c4a7e7'
    cyan: '#ea9a97'
    white: '#e0def4'
selection:
  save_to_clipboard: true
cursor:
  style: Block
  vi_mode_style: None
  unfocused_hollow: true
  thickness: 0.15
